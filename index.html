<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navbar</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">MySite</div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
      <li><a href="#"><i class="fas fa-user"></i> About</a></li>
      <li><a href="#"><i class="fas fa-cogs"></i> Services</a></li>
      <li><a href="#"><i class="fas fa-envelope"></i> Contact</a></li>
    </ul>
    <div class="hamburger" onclick="toggleMenu(this)">☰</div>
  </nav>

  <script>
    function toggleMenu(menuIcon) {
      const navLinks = document.getElementById("navLinks");
      navLinks.classList.toggle("active");
      menuIcon.textContent = navLinks.classList.contains("active") ? "✖" : "☰";
    }
  </script>

</body>
</html>
